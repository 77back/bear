name: daily-content

# 每日定时跑内容管线：抓取 → 加工 → 汇总 → 同步到 app → 提交 content → 构建 PWA → 部署 Pages
# 构建框架 §8.5。手动触发可用于验收。

on:
  schedule:
    - cron: '0 22 * * *' # 22:00 UTC ≈ 北京 06:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-content
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install pipeline deps
        run: pip install -r pipeline/requirements.txt

      - name: Fetch (RSSHub + 栏目页直抓)
        working-directory: pipeline
        env:
          RSSHUB_BASE: ${{ vars.RSSHUB_BASE }}
        run: python fetch.py

      - name: Process (LLM 加工；无 key 则降级，绝不编造)
        working-directory: pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: python process.py

      - name: Build content JSON
        working-directory: pipeline
        run: python build_content.py

      - name: Sync content → app/public/content
        working-directory: pipeline
        run: python sync_to_app.py

      - name: Commit content & seen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content pipeline/seen.json app/public/content
          git commit -m "chore(content): daily $(date -u +%F)" || echo "nothing to commit"
          git push

      - name: Build PWA
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
