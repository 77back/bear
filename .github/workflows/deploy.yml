name: deploy-pages

# 推送 main 即构建部署 GitHub Pages（只构建，不跑内容管线；管线由 daily.yml 负责）。
# 与 daily.yml 分工：daily.yml 每天定时产内容+部署；本 workflow 让代码/内容推送后 github.io 立即跟上。
# CI 自己用 GITHUB_TOKEN 推的 content 提交不会再触发 workflow（GitHub 默认行为），无循环风险。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Build PWA
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
